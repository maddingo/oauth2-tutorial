
server:
  port: 9000

debug: false
logging:
  level:
    root: info
    org.springframework.security: debug
    org.springframework.web: trace

spring:
  security:
    oauth2:
      authorizationserver:
        client:
          public-client:
            registration:
              client-id: "public-client"
              client-authentication-methods:
                - "none"
              authorization-grant-types:
                - "authorization_code"
              redirect-uris:
                - "http://localhost:8080/login/oauth2/code/messaging-client-oidc"
                - "http://localhost:8080/login/oauth2/code/messaging-client-authorization-code"
                - "http://localhost:8080/authorized"
                - "http://client-app:8080/login/oauth2/code/messaging-client-oidc"
                - "http://client-app:8080/login/oauth2/code/messaging-client-authorization-code"
                - "http://client-app:8080/authorized"
                - "http://localhost:3000/login/oauth2/code/messaging-client-oidc"
                - "http://localhost:3000/login/oauth2/code/messaging-client-authorization-code"
                - "http://localhost:3000/authorized"
                - "http://localhost:3000/callback"
              post-logout-redirect-uris:
                - "http://client-app:8080/"
              scopes:
                - "openid"
                - "profile"
            require-authorization-consent: true
            require-proof-key: true
  http:
    codecs:
      log-request-details: true

auth-server:
  issuer: 'http://idp:9000'
  users:
    - username: "user1"
      password: "{noop}password"
      roles:
        - "USER"
    - username: "admin"
      password: "{noop}admin"
      roles:
        - "ADMIN"
        - "USER"
  cors:
    allowed-origins:
      - "http://localhost:8080"
      - "http://client-app:8080"
      - "http://localhost:3000"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "*"
    allow-credentials: true

