# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build

on:
  push:
    branches:
      - "develop"
      - "main"
  pull_request:
    branches:
      - "develop"
      - "main"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: 'Lyse-AS/lyse-build-java-composite-action@develop'
      with:
        java-version: '21'
        az-client-id: ${{ secrets.AZ_SPN_LYP_ACRPUSH_ID }}
        az-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        az-subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_LYP_FELLES_PROD }}
      env:
        ACTIONS_ID_TOKEN_REQUEST_URL: ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_URL }}
