# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build

on:
  push:
    branches:
      - "develop"
      - "main"
      - "release/*"
    paths-ignore:
      - "*.md"
      - "*.sh"
  pull_request:
    types:
      - edited
      - opened
      - reopened
      - synchronize
    branches:
      - "develop"
      - "main"
      - "release/*"
  workflow_dispatch:
    inputs:
      acr-publish:
        description: 'If checked, the workflow will publish the docker images to the container registry'
        required: true
        default: false
        type: boolean


jobs:
  build:
    permissions:
      checks: write
      pull-requests: write
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25']

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ matrix.java }}
      - name: Build with Maven
        run: mvn -B verify
      - name: Write out Unit Test report annotation for forked repo
        if: success() || failure()
        uses: mikepenz/action-junit-report@v6.0.1
        with:
          report_paths: '**/*-reports/TEST-*.xml'
          comment: true
          detailed_summary: true
          group_suite: true
